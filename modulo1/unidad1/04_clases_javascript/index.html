<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fundamentos JS</title>
        <link rel="stylesheet" href="./assets/css/styles.css" />
    </head>
    <body>
        <main class="contenedor">
            <header class="cabecera">
                <h1>Fundamentos JS</h1>
            </header>

            <section class="panel">
                <h2>1. Métodos de Salida (Output)</h2>
                <button id="btnSalidas">Ejecutar console.log() y alert()</button>
            </section>

            <section class="panel">
                <h2>2. Variables y Tipos de Datos</h2>
                <button id="btnVariables">Declarar y Evaluar Variables</button>
            </section>

            <section class="panel">
                <h2>3. Operadores Aritméticos</h2>
                <button id="btnAritmeticos">Calcular Operaciones</button>
            </section>

            <section class="panel">
                <h2>4. Operadores de Comparación</h2>
                <button id="btnComparacion">Comparar Valores</button>
            </section>

            <section class="panel">
                <h2>5. Entrada de Datos (Input)</h2>
                <button id="btnInput">Solicitar Datos</button>
            </section>
        </main>

        <script src="./assets/js/app.js"></script>
    </body>
</html>
